name: Compile and core regression
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install system fonts for Chinese UI checks
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
      - run: bash scripts/test-core.sh
      - run: bash scripts/build.sh coreCheck :fabric-1.20.1:build
