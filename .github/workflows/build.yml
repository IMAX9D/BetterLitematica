name: Build supported Minecraft versions
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Run core regression checks
        run: bash scripts/build.sh :core:selfTest
  targets:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.matrix.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: python3 -c 'import json; print("versions=" + json.dumps([t["minecraft"] for t in json.load(open("targets.json"))["targets"]]))' >> "$GITHUB_OUTPUT"
  build:
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        minecraft: ${{ fromJSON(needs.targets.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build installable mod
        env:
          MINECRAFT_TARGET: ${{ matrix.minecraft }}
        run: bash scripts/build.sh ":fabric-$MINECRAFT_TARGET:build"
