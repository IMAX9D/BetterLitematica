plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.21' apply false
    id 'net.fabricmc.fabric-loom' version '1.17.21' apply false
}
allprojects { group = 'dev.betterlitematica'; version = '0.4.1-dev'; repositories { mavenCentral() } }
subprojects {
    apply plugin: 'java-library'
    if (rootProject.providers.gradleProperty('buildRoot').isPresent()) {
        layout.buildDirectory = rootProject.file(rootProject.providers.gradleProperty('buildRoot').get() + '/' + project.name)
    }
    java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
    tasks.withType(Jar).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
}
gradle.ext.minecraftTargets.each { target ->
    project(":fabric-${target.minecraft}") {
        ext.minecraftTarget = target
        apply from: rootProject.file('gradle/fabric-adapter.gradle')
    }
}
